<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAN Webserver Picker — Field Edition</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; margin-top: 15px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; vertical-align: top; }
    .alive { color: green; }
    .dead { color: #999; }
    #statusLine { margin-top: 10px; font-weight: bold; }
    input.noteBox { width: 95%; padding: 4px; box-sizing: border-box; }
    #filename { width: 200px; padding: 4px; }
  </style>
</head>
<body>

<h2>LAN Webserver Picker — Field Edition</h2>

<div id="yourIP">Your IP: detecting…</div>
<br>

<label>
  Subnet base:
  <input id="subnetBase" size="10">
</label>
<br>

<label>
  Host range:
  <input id="startHost" type="number" value="1" min="1" max="254" style="width:60px;"> –
  <input id="endHost" type="number" value="254" min="1" max="254" style="width:60px;">
</label>
<br>

<label>
  Open-link path:
  <input id="testPath" size="10">
</label>
<br><br>

<button id="scanBtn">Scan</button>

<div id="statusLine"></div>

<h3>Results</h3>
<table>
  <thead>
    <tr>
      <th>IP</th>
      <th>Status</th>
      <th>HTTP</th>
      <th>Open</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>
</table>

<br>
<label>
  Filename:
  <input id="filename" placeholder="deadwood-scan">
</label>
<button id="downloadBtn">Download</button>

<script>
// ------------------------------
// LOCAL STORAGE HELPERS
// ------------------------------
function saveSetting(key, value) {
  localStorage.setItem(key, value);
}
function loadSetting(key, fallback = "") {
  return localStorage.getItem(key) || fallback;
}

// ------------------------------
// DETECT LOCAL IP (WebRTC trick)
// ------------------------------
function detectLocalIP(callback) {
  const pc = new RTCPeerConnection({iceServers: []});
  pc.createDataChannel("");
  pc.createOffer().then(offer => pc.setLocalDescription(offer));

  pc.onicecandidate = event => {
    if (!event || !event.candidate) return;
    const parts = event.candidate.candidate.split(" ");
    const ip = parts[4];
    if (ip && ip.match(/^(\d+\.){3}\d+$/)) {
      callback(ip);
      pc.onicecandidate = null;
      pc.close();
    }
  };
}

// ------------------------------
// UNIVERSAL PING USING <link>
// ------------------------------
function pingHost(ip, timeout = 1200) {
  return new Promise(resolve => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `http://${ip}/ping.css?ts=${Date.now()}`;

    let done = false;
    const timer = setTimeout(() => {
      if (!done) {
        done = true;
        resolve(false);
      }
    }, timeout);

    link.onload = () => {
      if (!done) {
        done = true;
        clearTimeout(timer);
        resolve(true);
      }
    };

    link.onerror = () => {
      if (!done) {
        done = true;
        clearTimeout(timer);
        resolve(true);
      }
    };

    document.head.appendChild(link);
  });
}

// ------------------------------
// HTTP PROBE (always tests "/")
// ------------------------------
function probeHTTP(ip, port = 80, timeout = 1500) {
  return new Promise(resolve => {
    const script = document.createElement("script");
    let done = false;

    script.onload = () => {
      if (!done) {
        done = true;
        resolve(true);
      }
    };

    script.onerror = () => {
      if (!done) {
        done = true;
        resolve(true);
      }
    };

    script.src = `http://${ip}:${port}/?ts=${Date.now()}`;
    document.body.appendChild(script);

    setTimeout(() => {
      if (!done) {
        done = true;
        resolve(false);
      }
    }, timeout);
  });
}

// ------------------------------
// MAIN SCAN LOGIC
// ------------------------------
document.getElementById("scanBtn").onclick = async () => {
  const subnetBase = document.getElementById("subnetBase").value.trim();
  const startHost = parseInt(document.getElementById("startHost").value, 10);
  const endHost = parseInt(document.getElementById("endHost").value, 10);
  const openPath = document.getElementById("testPath").value.trim() || "/";

  saveSetting("subnetBase", subnetBase);
  saveSetting("testPath", openPath);

  const tbody = document.getElementById("results");
  const statusLine = document.getElementById("statusLine");

  tbody.innerHTML = "";
  statusLine.textContent = "";

  const aliveHosts = [];

  // PHASE 1 — PING
  for (let host = startHost; host <= endHost; host++) {
    const ip = `${subnetBase}.${host}`;
    statusLine.textContent = `Pinging: ${ip}`;

    const alive = await pingHost(ip);

    if (alive) {
      aliveHosts.push(ip);

      const savedNote = loadSetting("note_" + ip, "");

      const row = document.createElement("tr");
      row.id = `row-${ip}`;
      row.innerHTML = `
        <td>${ip}</td>
        <td class="alive">Alive</td>
        <td>Pending...</td>
        <td></td>
        <td><input class="noteBox" id="note-${ip}" value="${savedNote}"></td>
      `;
      tbody.appendChild(row);

      document.getElementById(`note-${ip}`).oninput = e => {
        saveSetting("note_" + ip, e.target.value);
      };
    }
  }

  // PHASE 2 — HTTP TEST
  for (const ip of aliveHosts) {
    statusLine.textContent = `Testing HTTP: ${ip}`;

    const row = document.getElementById(`row-${ip}`);
    const httpCell = row.children[2];
    const openCell = row.children[3];

    httpCell.textContent = "Checking...";

    const http = await probeHTTP(ip);

    if (http) {
      httpCell.textContent = "Webserver";
      httpCell.className = "alive";

      const link = document.createElement("a");
      link.href = `http://${ip}${openPath}`;
      link.target = "_blank";
      link.textContent = "Open";
      openCell.appendChild(link);
    } else {
      httpCell.textContent = "No HTTP";
      httpCell.className = "dead";
    }
  }

  statusLine.textContent = "Scan complete.";
};

// ------------------------------
// DOWNLOAD LOGIC
// ------------------------------
document.getElementById("downloadBtn").onclick = () => {
  const filenameBase = document.getElementById("filename").value.trim() || "scan";
  saveSetting("filename", filenameBase);

  const filename = filenameBase + ".txt";

  let text = "";
  text += "Scan date: " + new Date().toLocaleString() + "\n";
  text += "Your IP: " + loadSetting("yourIP", "unknown") + "\n\n";

  const rows = document.querySelectorAll("#results tr");
  rows.forEach(row => {
    const ip = row.children[0].textContent;
    const http = row.children[2].textContent;
    const note = row.children[4].children[0].value;
    text += `${ip}  ${http}  Notes: ${note}\n`;
  });

  const blob = new Blob([text], {type: "text/plain"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
};

// ------------------------------
// RESTORE SETTINGS ON LOAD
// ------------------------------
window.onload = () => {
  document.getElementById("subnetBase").value = loadSetting("subnetBase", "10.41.1");
  document.getElementById("testPath").value = loadSetting("testPath", "/");
  document.getElementById("filename").value = loadSetting("filename", "deadwood-scan");

  detectLocalIP(ip => {
    document.getElementById("yourIP").textContent = "Your IP: " + ip;
    saveSetting("yourIP", ip);

    const parts = ip.split(".");
    if (parts.length === 4) {
      const base = parts[0] + "." + parts[1] + "." + parts[2];
      document.getElementById("subnetBase").value = base;
      saveSetting("subnetBase", base);
    }
  });
};
</script>

</body>
</html>
